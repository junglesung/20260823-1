<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>開心動物</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="viewport">
    <div class="stage" id="stage" aria-label="開心動物農場">
      <div class="sky">
        <div class="sun" aria-hidden="true"></div>
        <div class="cloud cloud-a" aria-hidden="true"></div>
        <div class="cloud cloud-b" aria-hidden="true"></div>
        <div class="cloud cloud-c" aria-hidden="true"></div>
      </div>

      <div class="hills" aria-hidden="true">
        <div class="hill hill-back"></div>
        <div class="hill hill-mid"></div>
        <div class="hill hill-front"></div>
      </div>

      <header class="title-wrap">
        <p class="farm-label">我的農場</p>
        <h1 class="farm-name">開心動物</h1>
      </header>

      <div class="scene">
        <div class="tree tree-left" aria-hidden="true">
          <span class="tree-canopy"></span>
          <span class="tree-trunk"></span>
        </div>
        <div class="tree tree-right" aria-hidden="true">
          <span class="tree-canopy"></span>
          <span class="tree-trunk"></span>
        </div>

        <div class="house" aria-label="農舍">
          <div class="house-roof"></div>
          <div class="house-chimney">
            <span class="smoke s1"></span>
            <span class="smoke s2"></span>
            <span class="smoke s3"></span>
          </div>
          <div class="house-body">
            <div class="house-window left"></div>
            <div class="house-window right"></div>
            <div class="house-door"></div>
          </div>
          <div class="house-base"></div>
          <div class="door-lock" id="door-lock" hidden>已鎖門</div>
        </div>

        <div class="people">
          <div class="person farmer" aria-label="農夫">
            <div class="hat"></div>
            <div class="head"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
            <div class="body"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
          </div>
          <div class="person child" aria-label="小孩">
            <div class="head"></div>
            <div class="hair"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
            <div class="body"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
          </div>
        </div>

        <div class="pond" aria-hidden="true"></div>
        <div id="herd" class="herd"></div>
        <div id="foods" class="foods"></div>
        <div class="flowers" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="animal cow" aria-label="乳牛">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="head"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="snout"></div>
          <div class="mouth"></div>
          <div class="body"></div>
          <div class="spot a"></div>
          <div class="spot b"></div>
          <div class="leg l1"></div>
          <div class="leg l2"></div>
          <div class="leg l3"></div>
          <div class="leg l4"></div>
          <div class="tail"></div>
          <span class="name-tag">乳牛</span>
        </div>

        <div class="animal pig" aria-label="小豬">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="head"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="snout"></div>
          <div class="mouth"></div>
          <div class="body"></div>
          <div class="leg l1"></div>
          <div class="leg l2"></div>
          <div class="leg l3"></div>
          <div class="leg l4"></div>
          <div class="tail"></div>
          <span class="name-tag">小豬</span>
        </div>

        <div class="animal sheep" aria-label="綿羊">
          <div class="fluff"></div>
          <div class="head"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth"></div>
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="leg l1"></div>
          <div class="leg l2"></div>
          <div class="leg l3"></div>
          <div class="leg l4"></div>
          <span class="name-tag">綿羊</span>
        </div>

        <div class="animal chicken" aria-label="小雞">
          <div class="comb"></div>
          <div class="head"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="beak"></div>
          <div class="mouth"></div>
          <div class="body"></div>
          <div class="wing"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
          <span class="name-tag">小雞</span>
        </div>

        <div class="animal duck" aria-label="小鴨">
          <div class="head"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="beak"></div>
          <div class="mouth"></div>
          <div class="body"></div>
          <div class="wing"></div>
          <span class="name-tag">小鴨</span>
        </div>

        <div class="animal kitten" aria-label="小貓">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="head"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth"></div>
          <div class="body"></div>
          <div class="leg l1"></div>
          <div class="leg l2"></div>
          <div class="leg l3"></div>
          <div class="leg l4"></div>
          <div class="tail"></div>
          <span class="name-tag">小貓</span>
        </div>
      </div>

      <div class="rain-layer" id="rain-layer" hidden></div>

      <div class="hud" id="hud" hidden>
        <div class="hud-card">
          <span>金錢</span>
          <strong id="money-value">10</strong>
        </div>
        <div class="hud-card">
          <span>動物</span>
          <strong id="animal-count">100</strong>
        </div>
        <div class="hud-card">
          <span>肚子餓</span>
          <strong id="hungry-count">0</strong>
        </div>
        <div class="hud-card">
          <span id="weather-label">下雨倒數</span>
          <strong id="weather-value">60秒</strong>
        </div>
        <div class="hud-card goal">
          <span>目標</span>
          <strong>存到 100 元</strong>
        </div>
      </div>

      <div class="actions" id="title-actions">
        <button type="button" class="start-btn" id="start-btn">
          開始遊戲
        </button>
        <p class="start-hint">餵飽動物、下雨撐傘，存到 100 元就能升級牧場</p>
      </div>

      <div class="game-actions" id="game-actions" hidden>
        <button type="button" class="game-btn food-btn" id="food-btn">食物</button>
        <button type="button" class="game-btn umbrella-btn" id="umbrella-btn" hidden>雨傘</button>
        <button type="button" class="game-btn shop-btn" id="shop-btn" hidden>升級牧場</button>
      </div>

      <p class="toast" id="toast" hidden></p>

      <div class="overlay" id="neighbor-overlay" hidden>
        <div class="panel">
          <h2>只剩一隻動物了！</h2>
          <p id="neighbor-text">趕快去隔壁把動物的繩子偷來，把牠們帶回來，然後把門鎖住。</p>
          <button type="button" class="panel-btn" id="neighbor-btn">去隔壁</button>
        </div>
      </div>

      <div class="overlay" id="shop-overlay" hidden>
        <div class="panel">
          <h2>存到 100 元了！</h2>
          <p>可以去別的牧場工作，也可以升級農夫的地方、升級動物，還能讓動物有更多食物。</p>
          <div class="shop-list">
            <button type="button" class="panel-btn" id="work-btn">去別的牧場工作</button>
            <button type="button" class="panel-btn" id="upgrade-farm-btn">升級農夫的地方</button>
            <button type="button" class="panel-btn" id="upgrade-animal-btn">升級動物</button>
            <button type="button" class="panel-btn" id="upgrade-food-btn">更多食物</button>
          </div>
          <button type="button" class="panel-btn ghost" id="shop-close-btn">先繼續照顧動物</button>
        </div>
      </div>

      <p class="updated">最後更新：2026/08/23 14:00</p>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
